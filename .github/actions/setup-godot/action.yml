name: Set up Godot
description: Installs the Godot editor and, optionally, the Android export templates (both cached).

inputs:
  version:
    description: Godot version, e.g. 4.7.2
    required: true
  android-templates:
    description: Also install the Android export templates
    default: "false"

runs:
  using: composite
  steps:
    - name: Cache Godot editor
      id: cache-editor
      uses: actions/cache@v4
      with:
        path: ~/godot-bin
        key: godot-editor-${{ inputs.version }}

    - name: Download Godot editor
      if: steps.cache-editor.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p ~/godot-bin
        cd ~/godot-bin
        curl -fsSL --retry 3 -o godot.zip \
          "https://github.com/godotengine/godot-builds/releases/download/${{ inputs.version }}-stable/Godot_v${{ inputs.version }}-stable_linux.x86_64.zip"
        unzip -q godot.zip
        rm godot.zip
        mv Godot_v*_linux.x86_64 godot

    - name: Put Godot on PATH
      shell: bash
      run: |
        chmod +x ~/godot-bin/godot
        sudo ln -sf ~/godot-bin/godot /usr/local/bin/godot
        godot --headless --version

    - name: Cache Android export templates
      if: inputs.android-templates == 'true'
      id: cache-templates
      uses: actions/cache@v4
      with:
        path: ~/.local/share/godot/export_templates
        key: godot-android-templates-${{ inputs.version }}

    - name: Download Android export templates
      if: inputs.android-templates == 'true' && steps.cache-templates.outputs.cache-hit != 'true'
      shell: bash
      run: |
        dir=~/.local/share/godot/export_templates/${{ inputs.version }}.stable
        mkdir -p "$dir"
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/templates.tpz" \
          "https://github.com/godotengine/godot-builds/releases/download/${{ inputs.version }}-stable/Godot_v${{ inputs.version }}-stable_export_templates.tpz"
        # Only the Android templates are needed; skip the other platforms.
        unzip -q -j "$RUNNER_TEMP/templates.tpz" 'templates/android_*' 'templates/version.txt' -d "$dir"
        rm "$RUNNER_TEMP/templates.tpz"
        ls -la "$dir"
